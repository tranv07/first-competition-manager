services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fcm
      POSTGRES_PASSWORD: fcm_dev_password
      POSTGRES_DB: first_competition_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcm -d first_competition_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
